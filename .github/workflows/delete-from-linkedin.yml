name: Delete Article from LinkedIn

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:  # Allow manual trigger
    inputs:
      article_paths:
        description: 'Comma-separated paths to deleted articles (e.g., article/old-post.html,article/another.html)'
        required: true
        type: string

jobs:
  delete-from-linkedin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Fetch last 2 commits to detect deleted files

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd .github/scripts
          npm install axios

      - name: Detect deleted articles
        id: detect_deleted
        run: |
          # Get list of deleted HTML files in article/ directory
          DELETED_FILES=$(git diff --name-only --diff-filter=D HEAD^ HEAD | grep '^article/.*\.html$' | grep -v 'article-template.html' || echo "")

          if [ -z "$DELETED_FILES" ]; then
            echo "No deleted articles detected"
            echo "articles=" >> $GITHUB_OUTPUT
          else
            echo "Deleted articles:"
            echo "$DELETED_FILES"
            # Convert newlines to commas for passing to next step
            ARTICLES_CSV=$(echo "$DELETED_FILES" | tr '\n' ',')
            echo "articles=$ARTICLES_CSV" >> $GITHUB_OUTPUT
          fi

      - name: Delete from LinkedIn
        if: steps.detect_deleted.outputs.articles != ''
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          DELETED_ARTICLES: ${{ steps.detect_deleted.outputs.articles }}
        run: node .github/scripts/delete-from-linkedin.js

      - name: Commit updated mapping database
        if: steps.detect_deleted.outputs.articles != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/scripts/article-linkedin-map.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update mappings after LinkedIn post deletion [automated]"
          git push

      - name: Summary
        if: steps.detect_deleted.outputs.articles != ''
        run: |
          echo "🗑️ Articles deleted from LinkedIn"
          echo "📝 Articles: ${{ steps.detect_deleted.outputs.articles }}"
